server:
  error:
    include-stacktrace: on_param

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/patient?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver   # <-- adicionar

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect  # <-- adicionar
    hibernate:
      ddl-auto: update

logging:
  level:
    org:
      hibernate:
        sql: DEBUG
        type: trace
