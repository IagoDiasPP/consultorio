version: '3.1'

services:
  db:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patient
      MYSQL_ROOT_HOST: "%"   # <-- ADICIONE ESTA LINHA
    ports:
      - "3312:3306"
    volumes:
      - dev_data:/var/lib/mysql

volumes:
  dev_data:


